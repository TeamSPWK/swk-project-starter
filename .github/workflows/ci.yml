name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks 가 이력을 봐야 한다

      # ── 시크릿 스캔은 프로젝트 초기화 여부와 무관하게 항상 돈다 ──
      # AI 도구가 co-author 인 커밋의 시크릿 유출률은 GitHub 평균의 약 2배다.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if project is initialized
        id: check
        run: |
          if [ ! -f "package.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ package.json 없음 — setup.sh 실행 전 템플릿 상태. 빌드 검증 스킵."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.skip != 'true'

      # 순서에 의미가 있다: 싼 검사부터 → 실패를 빨리 알린다.
      - name: Typecheck
        if: steps.check.outputs.skip != 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.check.outputs.skip != 'true'
        run: pnpm lint

      - name: Unit tests (Vitest)
        if: steps.check.outputs.skip != 'true'
        run: pnpm test -- --run

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - name: Check if e2e is set up
        id: check
        run: |
          if [ ! -f "playwright.config.ts" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ playwright.config.ts 없음 — E2E 미설정. 스킵."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.skip != 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.check.outputs.skip != 'true'
      - run: pnpm test:e2e
        if: steps.check.outputs.skip != 'true'

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check.outputs.skip != 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
