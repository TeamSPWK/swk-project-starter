# 전체 이력 시크릿 sweep — gitleaks(커밋 게이트)와 역할이 다르다.
#
# gitleaks   = regex+entropy, 오프라인, 밀리초 → 커밋·PR 을 막는 데 쓴다.
# TruffleHog = 발견한 자격증명이 **실제로 아직 살아있는지 API 로 검증** → 긴급 회전 대상을 골라낸다.
#
# 즉 이 잡의 산출물은 "유출됐을 수도 있음" 이 아니라 "지금 유효하니 당장 회전하라" 는 목록이다.
name: Secret sweep (full history)

on:
  schedule:
    - cron: '17 20 * * 1' # 매주 월 05:17 KST
  workflow_dispatch:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog (verified only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified --no-update

      - name: 결과 안내
        if: failure()
        run: |
          echo "::error::살아있는(verified) 시크릿이 이력에서 발견됐습니다."
          echo "이력에서 지우는 것만으로는 부족합니다 — **먼저 회전(rotate)** 하세요."
          echo "이미 노출된 값은 되돌릴 수 없고, 무효화만이 실효 조치입니다."
